<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - JupiterWeb</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffcc00;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            background-color: white;
        }

        header img {
            height: 50px;
            width: auto;
        }

        header h1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 38px;
            font-weight: bold;
            color: black;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border-top: 8px solid #ffcc00;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #003366;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #003366;
        }

        input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #001f4d;
            cursor: pointer;
        }

        .links {
            margin-top: 10px;
            text-align: center;
        }

        .links a {
            display: block;
            margin-top: 5px;
            color: #003366;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
            color: #000;
        }

        footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            header img {
                height: 60px;
            }

            header h1 {
                font-size: 24px;
            }

            .login-box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="img/logo.jpg" alt="Logo USP">
    <h1>JupiterWeb</h1>
</header>

<main>
    <div class="login-box">
        <h2>Login</h2>

        <form action="#">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <div class="links">
            <a href="senha.html">Esqueci minha senha</a>
            <a href="cadastro.html">Primeiro acesso</a>
        </div>
    </div>
</main>

<footer>
    <p>Universidade de São Paulo - Sistema Acadêmico</p>
    <p>© 2026 Todos os direitos reservados</p>
</footer>

</body>
</html>
