<input type="text"  
       placeholder="Buscar..."
       hx-get="/lista"
       hx-target="#lista"
       hx-trigger="input changed delay:500ms"
       hx-select="#lista"
       name="busca">

<div id="lista">
    <ul> 
        {% for aluno in alunos %}
            <li>{{ aluno.id }} - {{ aluno.nome }}</li>
        {% else %}
            <li>Não há alunos</li>
        {% endfor %}
    </ul>


    {% if page > 1 %}
        <button 
            hx-get="/lista?page={{ page-1 }}&busca={{ busca }}"
            hx-target="#lista"
            hx-select="#lista">
            Anterior
        </button>
    {% endif %}

    <span>Página {{ page }} de {{ total_pages }}</span>

    {% if page < total_pages %}
        <button 
            hx-get="/lista?page={{ page+1 }}&busca={{ busca }}"
            hx-target="#lista"
            hx-select="#lista">
            Próxima
        </button>
    {% endif %}

</div>
