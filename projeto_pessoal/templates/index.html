<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Passagens</title>
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin-bottom: 15px; }
        input, button { margin-right: 5px; }
        ul { list-style: none; padding-left: 0; }
        li { margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>Cadastro de Cidades</h1>
    <form hx-post="/cidades" hx-target="#lista-cidades" hx-swap="beforeend">
        <input type="text" name="nome" placeholder="Nome" required>
        <input type="number" name="latitude" placeholder="Latitude" step="0.0001" required>
        <input type="number" name="longitude" placeholder="Longitude" step="0.0001" required>
        <button type="submit">Adicionar Cidade</button>
    </form>
    <ul id="lista-cidades"></ul>

    <h1>Cadastro de Viagens</h1>
    <form hx-post="/viagens" hx-target="#lista-viagens" hx-swap="beforeend">
        <input type="number" name="origem_id" placeholder="ID Origem" required>
        <input type="number" name="destino_id" placeholder="ID Destino" required>
        <input type="text" name="horario" placeholder="Horário" required>
        <input type="number" name="preco" placeholder="Preço" step="0.01" required>
        <button type="submit">Adicionar Viagem</button>
    </form>
    <ul id="lista-viagens"></ul>

    <h1>Cadastro de Clientes</h1>
    <form hx-post="/clientes" hx-target="#lista-clientes" hx-swap="beforeend">
        <input type="text" name="nome" placeholder="Nome" required>
        <input type="text" name="contato" placeholder="Contato" required>
        <button type="submit">Adicionar Cliente</button>
    </form>
    <ul id="lista-clientes"></ul>

    <h1>Reservas</h1>
    <form hx-post="/reservas" hx-target="#lista-reservas" hx-swap="beforeend">
        <input type="number" name="viagem_id" placeholder="ID Viagem" required>
        <input type="number" name="assento" placeholder="Assento" required>
        <input type="number" name="cliente_id" placeholder="ID Cliente (opcional)">
        <button type="submit">Reservar</button>
    </form>
    <ul id="lista-reservas"></ul>
</body>
</html>
