{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 50px 20px; box-sizing: border-box;">
    
    <div class="login-box" style="width: 100%; max-width: 850px; background-color: #111; padding: 30px; border-radius: 15px; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h2 style="margin-top: 0;"><span class="highlight">Buscar</span> Passagens</h2>
        
        <form style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; align-items: center;" 
              hx-get="/viagens" 
              hx-target="#resultado-busca">
            
            <div style="display: flex; flex-direction: column; align-items: flex-start;">
                <label style="color: #888; font-size: 0.8rem; margin-bottom: 5px;">Origem</label>
                <select name="origem_id" 
                        hx-get="/cidades" 
                        hx-trigger="load" 
                        hx-target="this" 
                        style="padding: 12px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; min-width: 220px; cursor: pointer; outline: none;">
                    <option value="">Carregando...</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; align-items: flex-start;">
                <label style="color: #888; font-size: 0.8rem; margin-bottom: 5px;">Destino</label>
                <select name="destino_id" 
                        hx-get="/cidades" 
                        hx-trigger="load" 
                        hx-target="this" 
                        style="padding: 12px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; min-width: 220px; cursor: pointer; outline: none;">
                    <option value="">Carregando...</option>
                </select>
            </div>

            <button type="submit" style="width: auto; padding: 0 40px; margin-top: 22px; height: 48px; cursor: pointer; font-weight: bold;">
                Procurar
            </button>
        </form>
    </div>

    <div id="resultado-busca" style="
        width: 100%; 
        max-width: 850px; 
        margin-top: 40px; 
        display: flex; 
        flex-direction: column; 
        align-items: flex-start; /* Joga os itens para a esquerda */
        gap: 20px;
        box-sizing: border-box;
    ">
        <p style="width: 100%; text-align: center; color: #333; font-weight: bold; opacity: 0.6;">
            Escolha as cidades ou clique em procurar para ver tudo.
        </p>
    </div>
</div>
{% endblock %}
